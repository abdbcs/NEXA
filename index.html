<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Inter, Arial, sans-serif;
  background: #0b0d12;
  color: #f5f7fa;
  height: 100vh;
  overflow: hidden;
}

.app {
  display: flex;
  height: 100vh;
}

/* BARRA LATERAL */

.sidebar {
  width: 260px;
  background: #10131a;
  border-right: 1px solid #20242d;
  padding: 20px;
  display: flex;
  flex-direction: column;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 30px;
}

.logo-icon {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: linear-gradient(135deg, #7c5cff, #4f8cff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.new-chat {
  border: 1px solid #303642;
  background: #171b23;
  color: white;
  padding: 13px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 14px;
  margin-bottom: 25px;
}

.new-chat:hover {
  background: #202530;
}

.sidebar-title {
  color: #777f8d;
  font-size: 12px;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.history {
  color: #b8bec9;
  font-size: 14px;
  padding: 10px;
  border-radius: 8px;
}

.history:hover {
  background: #191d25;
}

/* ZONA PRINCIPAL */

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  height: 65px;
  border-bottom: 1px solid #20242d;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
}

.model {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
}

.status {
  width: 8px;
  height: 8px;
  background: #39d98a;
  border-radius: 50%;
}

.settings {
  background: transparent;
  border: none;
  color: #9ba3b0;
  font-size: 18px;
  cursor: pointer;
}

/* CHAT */

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 40px 20px;
}

.chat-inner {
  max-width: 820px;
  margin: auto;
}

.welcome {
  text-align: center;
  margin-top: 12vh;
}

.welcome-icon {
  width: 70px;
  height: 70px;
  margin: auto;
  border-radius: 22px;
  background: linear-gradient(135deg, #7c5cff, #4f8cff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  box-shadow: 0 10px 40px rgba(100, 80, 255, .25);
}

.welcome h1 {
  margin-top: 25px;
  font-size: 38px;
}

.welcome p {
  color: #858d9b;
  margin-top: 10px;
  font-size: 15px;
}

.message {
  display: flex;
  gap: 14px;
  margin-bottom: 28px;
  animation: appear .25s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.avatar {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #202531;
}

.user .avatar {
  background: #303642;
}

.message-content {
  line-height: 1.6;
  font-size: 15px;
  padding-top: 4px;
}

.label {
  font-weight: 600;
  margin-bottom: 4px;
}

/* ESCRITOR */

.composer {
  padding: 15px 20px 25px;
}

.composer-inner {
  max-width: 820px;
  margin: auto;
  border: 1px solid #303642;
  background: #151820;
  border-radius: 17px;
  display: flex;
  align-items: center;
  padding: 8px;
  box-shadow: 0 10px 35px rgba(0,0,0,.25);
}

textarea {
  flex: 1;
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  padding: 12px;
  font-size: 15px;
  font-family: inherit;
  height: 45px;
}

textarea::placeholder {
  color: #737b89;
}

.tool {
  background: transparent;
  border: none;
  color: #8b93a1;
  font-size: 20px;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  cursor: pointer;
}

.tool:hover {
  background: #20242d;
}

.send {
  background: #f4f5f7;
  color: #10131a;
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 11px;
  cursor: pointer;
  font-size: 17px;
  font-weight: bold;
}

.send:hover {
  transform: scale(1.04);
}

.disclaimer {
  text-align: center;
  color: #555d6a;
  font-size: 11px;
  margin-top: 10px;
}

/* MÓVIL */

@media (max-width: 700px) {
  .sidebar {
    display: none;
  }

  .welcome h1 {
    font-size: 30px;
  }

  .chat {
    padding: 25px 15px;
  }

  .composer {
    padding: 10px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">
      <div class="logo-icon">N</div>
      NEXA
    </div>

    <button class="new-chat" onclick="nuevoChat()">
      ＋ Nueva conversación
    </button>

    <div class="sidebar-title">
      Conversaciones
    </div>

    <div id="historial">
      <div class="history">Bienvenido a NEXA</div>
    </div>

  </aside>


  <main class="main">

    <header class="topbar">

      <div class="model">
        <span class="status"></span>
        NEXA
      </div>

      <button class="settings">⚙</button>

    </header>


    <section class="chat">

      <div class="chat-inner" id="chat">

        <div class="welcome" id="welcome">

          <div class="welcome-icon">
            ✦
          </div>

          <h1>¿En qué puedo ayudarte?</h1>

          <p>
            Soy NEXA, tu asistente inteligente.
          </p>

        </div>

      </div>

    </section>


    <div class="composer">

      <div class="composer-inner">

        <button class="tool" title="Adjuntar">
          ＋
        </button>

        <textarea
          id="input"
          placeholder="Escribe un mensaje a NEXA..."
          onkeydown="tecla(event)"
        ></textarea>

        <button class="tool" title="Voz">
          ◉
        </button>

        <button class="send" onclick="enviar()">
          ↑
        </button>

      </div>

      <div class="disclaimer">
        NEXA puede cometer errores. Comprueba la información importante.
      </div>

    </div>

  </main>

</div>


<script>

function tecla(event) {

  if (event.key === "Enter" && !event.shiftKey) {

    event.preventDefault();

    enviar();

  }

}


function enviar() {

  const input = document.getElementById("input");

  const texto = input.value.trim();

  if (!texto) return;

  const welcome = document.getElementById("welcome");

  if (welcome) {
    welcome.remove();
  }

  agregarMensaje("Tú", texto, true);

  input.value = "";

  setTimeout(() => {

    agregarMensaje(
      "NEXA",
      "Estoy procesando tu mensaje. 🧠<br><br>" +
      "Mi sistema de inteligencia artificial todavía está siendo conectado.",
      false
    );

  }, 700);

}


function agregarMensaje(nombre, texto, usuario) {

  const chat = document.getElementById("chat");

  const mensaje = document.createElement("div");

  mensaje.className = "message " + (usuario ? "user" : "");

  mensaje.innerHTML = `

    <div class="avatar">
      ${usuario ? "Tú" : "✦"}
    </div>

    <div class="message-content">

      <div class="label">
        ${nombre}
      </div>

      <div>
        ${texto}
      </div>

    </div>

  `;

  chat.appendChild(mensaje);

  chat.parentElement.scrollTop =
    chat.parentElement.scrollHeight;

}


function nuevoChat() {

  location.reload();

}

</script>

</body>
</html>
